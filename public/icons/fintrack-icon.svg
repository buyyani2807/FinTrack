<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MyFinTracker">
  <defs>
    <linearGradient id="mft-bg" x1="64" y1="448" x2="448" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04191b"/>
      <stop offset="0.55" stop-color="#0a3336"/>
      <stop offset="1" stop-color="#12575a"/>
    </linearGradient>
    <linearGradient id="mft-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1c6d70"/>
      <stop offset="1" stop-color="#6ee7d8"/>
    </linearGradient>
    <linearGradient id="mft-spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#35b3a6"/>
      <stop offset="1" stop-color="#a7f3e8"/>
    </linearGradient>
    <filter id="mft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#mft-bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="rgba(110,231,216,0.14)" stroke-width="2"/>
  <g filter="url(#mft-glow)">
    <rect x="108" y="292" width="52" height="112" rx="14" fill="url(#mft-bar)" opacity="0.72"/>
    <rect x="178" y="244" width="52" height="160" rx="14" fill="url(#mft-bar)" opacity="0.84"/>
    <rect x="248" y="188" width="52" height="216" rx="14" fill="url(#mft-bar)" opacity="0.94"/>
    <rect x="318" y="128" width="52" height="276" rx="14" fill="url(#mft-bar)"/>
    <path d="M344 128 C352 96 372 78 404 70" fill="none" stroke="url(#mft-spark)" stroke-width="10" stroke-linecap="round"/>
    <path d="M344 128 C360 104 392 92 424 108" fill="none" stroke="url(#mft-spark)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <path d="M344 128 C330 98 318 78 304 62" fill="none" stroke="url(#mft-spark)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M344 128 C368 118 390 132 406 154" fill="none" stroke="url(#mft-spark)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <circle cx="404" cy="70" r="12" fill="#a7f3e8"/>
    <circle cx="424" cy="108" r="10" fill="#6ee7d8"/>
    <circle cx="304" cy="62" r="10" fill="#6ee7d8"/>
    <circle cx="406" cy="154" r="9" fill="#35b3a6"/>
  </g>
</svg>
